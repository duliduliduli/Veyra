name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veyra
          POSTGRES_PASSWORD: veyra
          POSTGRES_DB: veyra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veyra" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://veyra:veyra@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run node tests/e2e/home.mjs --logic-only

      - run: node tests/e2e/studio-assistant.mjs
      - run: node tests/e2e/workspace-store.mjs
      - run: npm install --prefix /tmp/veyra-test-tools --no-save jsdom@26.1.0
      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/studio.mjs
      - run: node tests/e2e/chart-research.mjs
      - run: node --test tests/e2e/chart-tools.mjs
      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/chart-ui.mjs
      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/publications.mjs
      - run: node --test tests/e2e/strategy-backup.mjs
      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/strategy-backup-ui.mjs
      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/version-history-ui.mjs
      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/run-lifecycle-ui.mjs

      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/strategy-library-ui.mjs
      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/strategy-storage-ui.mjs
      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/backtest-approval-ui.mjs
      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/strategy-settings-lifecycle-ui.mjs
      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/approval-recovery-ui.mjs

      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/public-private-copy-ui.mjs

      - run: node --test tests/e2e/saved-links.mjs
      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/saved-links-ui.mjs

      - run: node --test tests/e2e/proposal-diff.mjs
      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/proposal-diff-ui.mjs

      - run: node --test tests/e2e/report-evidence.mjs

      - run: node --test tests/e2e/backtest-params.mjs

      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/editor-accessibility-ui.mjs

      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/browser-storage-access-ui.mjs

      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/reviewed-cloud-copy-ui.mjs

      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/editor-navigation-ui.mjs

      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/saved-chart-runs.mjs

      - run: npm install --prefix /tmp/veyra-test-tools --no-save playwright@1.56.1 && /tmp/veyra-test-tools/node_modules/.bin/playwright install --with-deps chromium
      - run: NODE_PATH=/tmp/veyra-test-tools/node_modules node --test tests/e2e/chart-workspace-ui.mjs
