name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veyra
          POSTGRES_PASSWORD: veyra
          POSTGRES_DB: veyra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veyra" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://veyra:veyra@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run node tests/e2e/home.mjs --logic-only

