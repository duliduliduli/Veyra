[project]
name = "veyra-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "veyra-billing",
    "veyra-sim",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veyra_api"]


[tool.uv.sources]
veyra-billing = { workspace = true }
veyra-sim = { workspace = true }
