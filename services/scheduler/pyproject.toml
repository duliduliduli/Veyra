[project]
name = "veyra-scheduler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "veyra-api",
    "veyra-sim",
    "veyra-billing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veyra_scheduler"]

[tool.uv.sources]
veyra-api = { workspace = true }
veyra-sim = { workspace = true }
veyra-billing = { workspace = true }
