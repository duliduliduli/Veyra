[project]
name = "veyra-sim"
version = "0.1.2"
requires-python = ">=3.12"
dependencies = [
    "veyra-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veyra_sim"]

[tool.uv.sources]
veyra-sdk = { workspace = true }
